apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: voxbox
  namespace: default
  labels:
    app: voxbox
  annotations:
    harvesterhci.io/volumeClaimTemplates: >-
      [{"metadata":{"name":"voxbox-rootdisk","annotations":{"harvesterhci.io/imageId":"default/debian-13-generic-amd64"}},"spec":{"accessModes":["ReadWriteMany"],"resources":{"requests":{"storage":"40Gi"}},"volumeMode":"Block","storageClassName":"harvester-longhorn"}}]
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        app: voxbox
    spec:
      domain:
        cpu:
          cores: 4
        memory:
          guest: 4Gi
        resources:
          limits:
            cpu: "4"
            memory: 4Gi
          requests:
            cpu: "2"
            memory: 4Gi
        machine:
          type: q35
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: nic-1
              model: virtio
              bridge: {}
      hostname: voxbox
      networks:
        - name: nic-1
          multus:
            # EDIT: your Harvester VLAN / cluster network
            networkName: default/vlan1
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: voxbox-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: voxbox-cloudinit
            networkDataSecretRef:
              name: voxbox-cloudinit
