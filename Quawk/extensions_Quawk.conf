; VoxBox Quawk P2T dialplan — include from extensions_custom.conf:
; #include extensions_Quawk.conf
;
; IAX2 extensions that should auto-answer on a VoxBox-Polycom use context=from-Quawk.

[from-Quawk]
; Quawk push-to-talk. The VoxBox-Polycom template auto-answers Alert-Info
; "Ring Answer" and plays the audio on the speaker with the microphone muted.
exten => _X.,1,NoOp(Quawk intercom from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(__ALERT_INFO=Ring Answer)
 same => n,Goto(from-internal,${EXTEN},1)
 same => n,Hangup()

exten => h,1,Hangup()
