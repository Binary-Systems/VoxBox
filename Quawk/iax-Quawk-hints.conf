; Sample snippets for /etc/asterisk/iax_custom.conf
; Prefer configuring IAX2 extensions in FreePBX GUI; use this only for globals.
;
; Default (matches Quawk template / FreePBX-style security):
; requirecalltoken=yes
;
; Stock libiax2/iaxclient has no CALLTOKEN (confirmed) — use on test extensions only:
; requirecalltoken=no
;
; Codec preference for Quawk (ulaw first):
; disallow=all
; allow=ulaw
; allow=alaw
; allow=opus
